      - name: Build APK with Buildozer
        run: script -q -c "buildozer -v android debug" /dev/null

      - name: Check bin directory contents
        run: ls -la bin/ || echo "Bin directory not found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarot-app-apk
          path: bin/*.apk
          if-no-files-found: ignore
