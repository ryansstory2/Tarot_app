      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            build-essential \
            openjdk-17-jdk

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1 # or whichever action you are using
        with:
          command: buildozer -v android debug
