name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    - name: Build APK with Official Buildozer Docker Image
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        command: buildozer -v android debug

    steps:
      - name:     - name: Maximize build disk space
      uses: AdityaGarg8/maximize-build-space@v5
      with:
        remove-dotnet: 'true'
        remove-android: 'false'
        remove-haskell: 'true'
        remove-codeql: 'true'
        reserve-swap: '4096'

        with:
          path: |
            .buildozer
            bin/
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK with Official Buildozer Docker Image
        run: |
          yes | docker run --rm -i \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -e BUILDOZER_ALLOW_ROOT=1 \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-android-apk
          path: bin/*.apk
          retention-days: 7
